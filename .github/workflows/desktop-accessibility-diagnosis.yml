name: Desktop accessibility diagnosis
on:
  push:
    branches: [codex/beta64-ax-diagnosis]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read pinned Flutter SDK
        id: flutter
        run: |
          required_flutter=$(python3 tool/verify_flutter.py --required-version)
          echo "version=$required_flutter" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: Select macOS Flutter framework with upstream accessibility fixes
        run: |
          sdk_bin=$(python3 tool/macos_flutter.py)
          echo "$sdk_bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=${sdk_bin%/bin}" >> "$GITHUB_ENV"
      - name: Verify patched release SDK
        run: python3 tool/verify_flutter.py
      - name: Resolve the release package graph
        run: flutter pub get --enforce-lockfile
      - name: Build the instrumented selector
        env:
          SELECT_SMOKE_ARCHIVE: ${{ runner.temp }}/selector.zip
        run: python3 -u tool/check_macos_select_semantics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selector-fixture
          path: ${{ runner.temp }}/selector.zip
          retention-days: 1

  probe:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: handshake, order: handshake, owner: platform, focus: default }
          - { label: platform, order: early, owner: platform, focus: default }
          - { label: original, order: early, owner: dart, focus: default }
          - { label: foreground, order: handshake, owner: platform, focus: front }
    name: Probe ${{ matrix.label }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: selector-fixture
          path: ${{ runner.temp }}
      - name: Read native selector and text-field state
        env:
          SELECT_SMOKE_ORDER: ${{ matrix.order }}
          SELECT_SMOKE_OWNER: ${{ matrix.owner }}
          SELECT_SMOKE_FOCUS: ${{ matrix.focus }}
        run: |
          cd "$RUNNER_TEMP"
          ditto -x -k selector.zip .
          python3 -u - <<'PROBE'
          from pathlib import Path
          import os, signal, subprocess, time
          exe = './select_smoke.app/Contents/MacOS/select_smoke'
          with Path('selector.log').open('w') as out:
              proc = subprocess.Popen([exe], stdout=out, stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  code = proc.wait(timeout=30)
              except subprocess.TimeoutExpired:
                  code = 124
                  os.killpg(proc.pid, signal.SIGKILL)
          print(Path('selector.log').read_text(errors='replace')[:32000], flush=True)
          print('NATIVE_EXIT',code,flush=True)
          raise SystemExit(code)
          PROBE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: selector-${{ matrix.label }}
          path: ${{ runner.temp }}/selector.log
          retention-days: 1
