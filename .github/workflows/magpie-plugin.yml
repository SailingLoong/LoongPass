name: Magpie plugin

on:
  pull_request:
    paths:
      - 'package.json'
      - 'runtime/bridge/**'
      - 'docs/magpie-plugin.md'
      - 'README.md'
      - 'tool/magpie_package.py'
      - 'test/magpie_package_test.py'
      - '.github/workflows/magpie-plugin.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'runtime/bridge/**'
      - 'docs/magpie-plugin.md'
      - 'README.md'
      - 'tool/magpie_package.py'
      - 'test/magpie_package_test.py'
      - '.github/workflows/magpie-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify distribution manifest and packed plugin
        run: python3 test/magpie_package_test.py
