name: Desktop release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Candidate build platform
        type: choice
        options: [all, windows]
        default: all

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    name: macOS Universal
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PACKAGE_APP: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read pinned Flutter SDK
        id: flutter
        run: |
          required_flutter=$(python3 tool/verify_flutter.py --required-version)
          echo "version=$required_flutter" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: Verify patched release SDK
        run: python3 tool/verify_flutter.py
      - name: Resolve locked dependencies
        run: |
          flutter pub get --enforce-lockfile
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          from tool.release_version import read_release_version
          assert os.environ['RELEASE_TAG'] == 'v' + read_release_version(pathlib.Path('.')).name, 'Tag must match pubspec.yaml'
          PY
      - name: Verify source behavior
        run: python3 tool/check.py
      - name: Build universal macOS app
        if: env.PACKAGE_APP == 'true'
        run: python3 tool/build_macos_release.py
      - name: Package source-matched app
        if: env.PACKAGE_APP == 'true'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/LoongPass.app dist/LoongPass-macOS-universal.zip
          shasum -a 256 dist/LoongPass-macOS-universal.zip > dist/SHA256SUMS
          git rev-parse HEAD > dist/SOURCE_COMMIT
          cp LICENSE *-LICENSE *-LICENSE.txt THIRD_PARTY_NOTICES.md SOURCE-ORIGIN.md dist/
          ditto -c -k --keepParent THIRD_PARTY_RUST dist/THIRD_PARTY_RUST.zip
      - name: Sign and verify update feed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 tool/make_appcast.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: env.PACKAGE_APP == 'true'
        with:
          name: LoongPass-macOS-universal
          path: dist/
          retention-days: 14
      - name: Preserve source-pinned publishing verifier
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p verify-tools
          cp build/macos/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update SPARKLE-LICENSE.txt verify-tools/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: LoongPass-update-verifier
          path: verify-tools/
          retention-days: 14
      - name: Remove build intermediates
        if: always()
        run: rm -rf build .dart_tool macos/ZcodeNative/lib ~/Library/Caches/LoongPass/native-macos ~/Library/Caches/Sparkle_generate_appcast


  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read pinned Flutter SDK
        id: flutter
        run: |
          $version = python tool/verify_flutter.py --required-version
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read pinned Flutter SDK' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: Verify patched release SDK
        run: python tool/verify_flutter.py
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Prepare verified native plugin runtime
        run: |
          python tool/plugin_sources.py
          if ($LASTEXITCODE -ne 0) { throw 'Native source provenance failed' }
          python test/plugin_sources_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Native source integrity checks failed' }
          $runtimeCache = Join-Path $env:LOCALAPPDATA 'LoongPass\RuntimeTests'
          $bun = (dart tool/prepare_bun.dart $runtimeCache | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $bun)) { throw 'Verified Bun is unavailable' }
          "LOONGPASS_BUN=$bun" >> $env:GITHUB_ENV
      - name: Check shared Dart behavior
        run: |
          dart analyze lib test
          if ($LASTEXITCODE -ne 0) { throw 'Dart analysis failed' }
          flutter test --no-pub --reporter expanded
          if ($LASTEXITCODE -ne 0) { throw 'Flutter behavior checks failed' }
          python test/flutter_toolchain_checks.py
          if ($LASTEXITCODE -ne 0) { throw 'Flutter SDK gate checks failed' }
      - name: Check authorization and reward protocols with synthetic accounts
        run: |
          $checks = Get-ChildItem test/native_*.test.mjs | ForEach-Object { $_.FullName }
          & $env:LOONGPASS_BUN test @checks
          if ($LASTEXITCODE -ne 0) { throw 'Native plugin protocol checks failed' }
      - name: Identify native toolchain
        id: toolchain
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio 2022 is required' }
          $version = (Get-Content (Join-Path $vs 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt')).Trim()
          "version=$($env:ImageVersion)-$version" >> $env:GITHUB_OUTPUT
          "WINSPARKLE_SDK=$(Join-Path $env:RUNNER_TOOL_CACHE 'LoongPass\WinSparkle')" >> $env:GITHUB_ENV
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: winsparkle
        with:
          path: ${{ env.WINSPARKLE_SDK }}
          key: winsparkle-x64-${{ steps.toolchain.outputs.version }}-${{ hashFiles('tool/patch_winsparkle.py', 'tool/build_winsparkle.ps1') }}
      - name: Build pinned Windows update SDK
        if: steps.winsparkle.outputs.cache-hit != 'true'
        run: tool/build_winsparkle.ps1 -Destination $env:WINSPARKLE_SDK
      - name: Build Windows application and native checks
        run: |
          flutter build windows --release
          cmake --build build/windows/x64 --config Release --target loongpass_storage_checks loongpass_authorization_checks
          & build/windows/x64/runner/Release/loongpass_storage_checks.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows native storage checks failed' }
          & build/windows/x64/runner/Release/loongpass_authorization_checks.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows native authorization checks failed' }
      - name: Package source-matched Windows app
        run: tool/package_windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: LoongPass-Windows-x64
          path: dist-windows/
          retention-days: 14
      - name: Remove Windows build intermediates
        if: always()
        run: Remove-Item -Recurse -Force build,.dart_tool -ErrorAction SilentlyContinue

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, windows]
    runs-on: macos-15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download CI artifact and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name LoongPass-macOS-universal --dir dist
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name LoongPass-update-verifier --dir verify-tools
          chmod +x verify-tools/sign_update
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name LoongPass-Windows-x64 --dir dist-windows
          python3 tool/make_windows_appcast.py dist-windows --tools verify-tools
          python3 tool/publish_release.py dist --tools verify-tools --windows-directory dist-windows
