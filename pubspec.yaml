name: loongpass
description: A desktop tool for AI accounts, reward collection and credit expiry.
version: 1.0.1-beta.43+43
publish_to: none
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '3.50.0'
dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  forui: ^0.27.7
  material_ui: ^1.0.0
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: SourceHanSansSC
      fonts:
        - asset: assets/fonts/SourceHanSansSC-VF.ttf
  assets:
    - SOURCE-HAN-SANS-LICENSE.txt
    - assets/app_icons/
    - assets/branding/loongpass.png
    - runtime/upstream.lock.json
    - runtime/launcher.mjs
    - runtime/migrate.mjs
    - runtime/patches/
    - runtime/bridge/
    - runtime/vendor/magpie/
    - runtime/vendor/plugins/workbuddy/
    - runtime/vendor/plugins/qoder/
    - runtime/vendor/plugins/minimax/
    - runtime/vendor/plugins/loomy/
    - runtime/vendor/plugins/trae/
    - runtime/vendor/plugins/zcode/
