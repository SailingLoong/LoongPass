version: 1.0.0+31
publish_to: none
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
