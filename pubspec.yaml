name: loongpass
description: A desktop tool for AI accounts, reward collection and credit expiry.
version: 1.0.1+32
publish_to: none
environment:
  sdk: '>=3.13.7 <4.0.0'
  flutter: '3.47.8'
dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/app_icons/
    - assets/branding/loongpass.png
    - assets/protocols/zcode_start_prompt.json
    - runtime/upstream.lock.json
    - runtime/launcher.mjs
    - runtime/vendor/magpie/
    - runtime/vendor/plugins/workbuddy/
    - runtime/vendor/plugins/qoder/
    - runtime/vendor/plugins/minimax/
    - runtime/vendor/plugins/loomy/
    - runtime/vendor/plugins/trae/
    - runtime/vendor/plugins/zcode/
