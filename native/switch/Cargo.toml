[package]
name = "loongpass-zcode-switch-candidate"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
[lib]
crate-type = ["rlib", "staticlib", "cdylib"]
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "=0.23.1"
sha2 = "=0.11.0"
zeroize = "=1.9.0"
getrandom = "=0.4.3"
libc = "=0.2.190"
loongpass-zcode-promotions-candidate = { path = "../promotions" }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "=1.53.2", features = ["rt", "time", "net"] }
[dev-dependencies]
tempfile = "=3.27.0"
[profile.dev]
debug = 0
incremental = false
[profile.release]
# Rust 1.95's debug stripping can misalign macOS proc-macro dylibs.
# https://github.com/rust-lang/rust/issues/157750
strip = "none"
[workspace]
